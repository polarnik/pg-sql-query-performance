# One Telegraf per monitored PostgreSQL instance, identical config (telegraf.d + sql/).
# Env load order: .env.example (defaults) -> config/telegraf/env/dbN.env (instance name) -> .env.dbN (real DSN, gitignored).
x-telegraf: &telegraf
  image: telegraf:1.32
  restart: unless-stopped
  depends_on:
    influxdb:
      condition: service_healthy
    db:
      condition: service_healthy
  environment:
    - INFLUXDB_HOST=sql_monitor_influxdb
  volumes:
    - "./config/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro"
    - "./config/telegraf/telegraf.d:/etc/telegraf/telegraf.d:ro"
    - "./sql:/etc/telegraf/sql:ro"
  command: "telegraf --config /etc/telegraf/telegraf.conf --config-directory /etc/telegraf/telegraf.d/"
  healthcheck:
    test: ["CMD-SHELL", "curl -XGET localhost:8080"]
    interval: 10s
    timeout: 10s
    retries: 40
    start_period: 90s

services:


  db:
    image: postgres:17
    container_name: sql_monitor_postgres
    restart: always
    command: >-
      postgres
      -c shared_preload_libraries=pg_stat_statements,auto_explain
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=5000
      -c track_io_timing=on
      -c track_activity_query_size=4096
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_USER: test
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - "./config/postgresql/run_dbdump.sh:/docker-entrypoint-initdb.d/run_dbdump.sh"
      - "./config/postgresql/monitoring_user.sql:/sql.tmp/monitoring_user.sql:ro"
      - "./config/postgresql/demo-small-20170815.sql:/dbdump/demo.sql:ro"
      - "./config/postgresql/grafana_db.sql:/sql.tmp/grafana_db.sql:ro"
      - "./config/postgresql/bookings.functions.sql:/sql.tmp/bookings.functions.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=postgres --username=test"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s


  influxdb:
    image: influxdb:1.8.6
    container_name: sql_monitor_influxdb
    restart: unless-stopped
    environment:
      - INFLUXDB_REPORTING_DISABLED=true
      - INFLUXDB_ADMIN_PASSWORD=password
      - INFLUXDB_ADMIN_USER=admin
    volumes:
      - influx-data:/var/lib/influxdb/
      - "./config/influxdb/influxdb.conf:/etc/influxdb/influxdb.conf:ro"
      - "./config/influxdb/init.sh:/docker-entrypoint-initdb.d/init.sh:ro"
      - "./config/influxdb/pg_monitoring_downsample.sh:/opt/influxdb-init/pg_monitoring_downsample.sh:ro"
    #ports:
    #  - 8086:8086
    #  - 2003:2003
    healthcheck:
      test: ["CMD-SHELL", "curl -XGET localhost:8086/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  telegraf:
    <<: *telegraf
    container_name: sql_monitor_telegraf
    env_file:
      - path: .env.example
      - path: config/telegraf/env/db1.env
      - path: .env.db1
        required: false

  telegraf-db2:
    <<: *telegraf
    container_name: sql_monitor_telegraf_db2
    env_file:
      - path: .env.example
      - path: config/telegraf/env/db2.env
      - path: .env.db2
        required: false

  telegraf-db3:
    <<: *telegraf
    container_name: sql_monitor_telegraf_db3
    env_file:
      - path: .env.example
      - path: config/telegraf/env/db3.env
      - path: .env.db3
        required: false

  telegraf-db4:
    <<: *telegraf
    container_name: sql_monitor_telegraf_db4
    env_file:
      - path: .env.example
      - path: config/telegraf/env/db4.env
      - path: .env.db4
        required: false

  grafana:
    image: grafana/grafana:11.3.0
    container_name: sql_monitor_grafana
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      influxdb:
        condition: service_started
      telegraf:
        condition: service_started
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - "./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro"
      - "./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro"
      - "./config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro"
    ports:
      - 3000:3000

  jmeter:
    container_name: sql_monitor_jmeter
    build:
      context: "./"
      dockerfile: "Dockerfile"
    depends_on:
      - db
      - influxdb
      - grafana
    volumes:
      - "./src:/tmp/src:ro"
      - "./pom.xml:/tmp/pom.xml:ro"
    restart: "no"
    command: "mvn clean verify -P jmeter,Stable -Dtps=1.0"
    ports:
      - 4445:4445

  # The same load on jmeter-java-dsl (Kotlin, src/test/kotlin): docker compose --profile dsl up jmeter-dsl
  jmeter-dsl:
    container_name: sql_monitor_jmeter_dsl
    profiles: ["dsl"]
    build:
      context: "./"
      dockerfile: "Dockerfile.jmeter-dsl"
    depends_on:
      db:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    volumes:
      - "./src:/tmp/src:ro"
      - "./pom.xml:/tmp/pom.xml:ro"
    working_dir: /tmp
    restart: "no"
    command: "mvn -B verify -P jmeter-dsl,Stable -Dtps=1.0"


networks:
  default:
    name: sql-monitor-network

volumes:
  jmeter-m2:
    name: sql-monitor-jmeter-m2
  influx-data:
    name: sql-monitor-influx-data
  grafana-data:
    name: sql-monitor-grafana-data
  postgresql-data:
    name: sql-monitor-postgresql17-data