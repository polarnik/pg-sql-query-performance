apiVersion: 1

# Datasource for the generated pg-* dashboards (dashboards/). The uid is referenced from code.
datasources:
 - name: "PostgreSQL Monitoring"
   uid: pg-monitoring
   type: influxdb
   access: proxy
   orgId: 1
   url: http://influxdb:8086
   database: pg_monitoring
   editable: false
   basicAuth: false
   jsonData:
     httpMode: POST
     maxSeries: 1000
     timeInterval: 15s
