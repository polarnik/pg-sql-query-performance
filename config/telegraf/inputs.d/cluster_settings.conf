# Cluster-wide settings / limits and pg_stat_statements health, once per instance (PG_DSN).

# 10m: settings / reference data (D7)
[[inputs.postgresql_extensible]]
    interval = "10m"
    address = "${PG_DSN}"
    outputaddress = "${PG_INSTANCE}"
    prepared_statements = false

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/cluster_settings_limits.sql"
        tagvalue = ""
        measurement = "pg_settings_limits"

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/cluster_stmt_info.sql"
        tagvalue = ""
        measurement = "pg_stmt_info"

    [inputs.postgresql_extensible.tags]
        db_instance = "${PG_INSTANCE}"
        host = "${PG_INSTANCE}"
        env = "${PG_ENV}"
        db_and_stand = "${INFLUX_DB_MONITORING}"
        retention_policy = "7d"
