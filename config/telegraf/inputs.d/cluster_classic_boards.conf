# Measurements for the classic hand-made boards pgActivity / pgquery / pgstat
# (Influx DBs INFLUX_DB_STATEMENTS / INFLUX_DB_ACTIVITY, continuous queries in config/influxdb/init.sh).
# Cluster scope through the maintenance DB (PG_DSN). SQL lives in sql/cluster_stat_*.sql.
# Not shipped by charts/pg-telegraf (see sync-files.sh).

[[inputs.postgresql_extensible]]
    interval = "60s"
    address = "${PG_DSN}"
    outputaddress = "${PG_INSTANCE}"
    prepared_statements = false

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/cluster_stat_statements.sql"
        tagvalue = "usename,datname,queryid,toplevel,query_md5,query_mask_md5"
        measurement = "pg_stat_statements"

    [inputs.postgresql_extensible.tags]
        db_instance = "${PG_INSTANCE}"
        host = "${PG_INSTANCE}"
        env = "${PG_ENV}"
        db_and_stand = "${INFLUX_DB_STATEMENTS}"
        retention_policy = "1d"


[[inputs.postgresql_extensible]]
    interval = "5s"
    address = "${PG_DSN}"
    outputaddress = "${PG_INSTANCE}"
    prepared_statements = false

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/cluster_stat_activity_count.sql"
        tagvalue = "usename,datname,state,wait_event,wait_event_type,backend_type"
        measurement = "pg_stat_activity_count"

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/cluster_stat_activity_idle_in_transaction.sql"
        tagvalue = "usename,datname,state,query_md5"
        measurement = "pg_stat_activity_idle_in_transaction"

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/cluster_stat_activity_idle.sql"
        tagvalue = "usename,datname,state,query_md5"
        measurement = "pg_stat_activity_idle"

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/cluster_stat_activity_waiting.sql"
        tagvalue = "usename,datname,state,wait_event,query_md5"
        measurement = "pg_stat_activity_waiting"

    [inputs.postgresql_extensible.tags]
        db_instance = "${PG_INSTANCE}"
        host = "${PG_INSTANCE}"
        env = "${PG_ENV}"
        db_and_stand = "${INFLUX_DB_ACTIVITY}"
        retention_policy = "7d"
