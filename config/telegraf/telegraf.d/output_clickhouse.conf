# Second storage of the pg_monitoring measurements: ClickHouse (dual write, outputs.influxdb in telegraf.conf is unchanged).
# Tables pg_monitoring.<measurement> are created by config/clickhouse/init/01_schema.sql; Telegraf only inserts (user writer).
# Tag / field names must match the table columns (an unknown column fails the whole insert of that table).
[[outputs.sql]]
  driver = "clickhouse"
  ## Telegraf 1.32 bundles clickhouse-go v1: native protocol, credentials / database as DSN query params
  ## (user:pass@ in the URL is ignored -> "default: Authentication failed")
  data_source_name = "tcp://${CH_HOST}:9000?username=${CH_WRITER_USER}&password=${CH_WRITER_PASSWORD}&database=pg_monitoring&read_timeout=60&write_timeout=60"
  timestamp_column = "time"
  ## Tables exist already, the writer has no DDL rights: only check that the table is readable
  table_exists_template = "SELECT 1 FROM {TABLE} LIMIT 1"
  connection_max_idle = 2
  connection_max_open = 2

  ## Only the pg_monitoring measurements; classic boards (cluster_classic_boards.conf) stay InfluxDB-only
  namepass = [
    "pg_activity_grouped",
    "pg_locks_blocked",
    "pg_db_limits",
    "pg_role_limits",
    "pg_db_stat",
    "pg_settings_limits",
    "pg_stmt_info",
    "pg_stmt",
    "pg_stmt_mask",
    "pg_stmt_totals",
    "pg_stmt_text",
    "pg_table_stat",
    "pg_index_stat",
  ]
  ## InfluxDB routing tags and the agent hostname (= db_instance) are not stored
  tagexclude = ["db_and_stand", "retention_policy", "host"]
