{{- range .Values.instances }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" (include "helm.fullname" $) .name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "helm.labels" $ | nindent 4 }}
    db-instance: {{ .name | quote }}
spec:
  replicas: {{ $.Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "helm.selectorLabels" $ | nindent 6 }}
      db-instance: {{ .name | quote }}
  template:
    metadata:
      labels:
        {{- include "helm.labels" $ | nindent 8 }}
        db-instance: {{ .name | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: telegraf
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          command:
            - telegraf
            - --config
            - /etc/telegraf/telegraf.conf
            - --config-directory
            - /etc/telegraf/telegraf.d
          env:
            - name: PG_INSTANCE
              value: {{ .name | quote }}
            - name: PG_ENV
              value: {{ $.Values.env | quote }}
            - name: INFLUXDB_HOST
              value: {{ $.Values.influxdb.host | quote }}
            - name: INFLUX_DB_MONITORING
              value: {{ $.Values.influxdb.database | quote }}
          envFrom:
            - secretRef:
                name: {{ include "pgtelegraf.secretName" (dict "root" $ "instance" .) }}
          livenessProbe:
            # outputs.health listens on localhost only
            exec:
              command: ["curl", "-fsS", "http://localhost:8080"]
            initialDelaySeconds: 30
            periodSeconds: 30
          {{- with $.Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/telegraf/telegraf.conf
              subPath: telegraf.conf
            - name: config-d
              mountPath: /etc/telegraf/telegraf.d
            - name: sql
              mountPath: /etc/telegraf/sql
      volumes:
        - name: config
          configMap:
            name: "{{ include "helm.fullname" $ }}-config"
        - name: config-d
          configMap:
            name: "{{ include "helm.fullname" $ }}-config"
            items:
              {{- range $path, $_ := $.Files.Glob "files/telegraf.d/*.conf" }}
              - key: {{ base $path }}
                path: {{ base $path }}
              {{- end }}
        - name: sql
          configMap:
            name: "{{ include "helm.fullname" $ }}-sql"
{{- end }}
