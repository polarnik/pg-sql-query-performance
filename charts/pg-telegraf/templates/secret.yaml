{{- range .Values.instances }}
{{- if not .existingSecret }}
{{- if not (and .dsn .appDsn) }}
{{- fail (printf "instance %q: set existingSecret or both dsn and appDsn" .name) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgtelegraf.secretName" (dict "root" $ "instance" .) }}
  labels:
    {{- include "helm.labels" $ | nindent 4 }}
type: Opaque
stringData:
  PG_DSN: {{ .dsn | quote }}
  PG_APP_DSN: {{ .appDsn | quote }}
{{- end }}
{{- end }}
