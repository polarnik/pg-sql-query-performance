applicationName: pg-telegraf
projectName: jcp-perftest-common

image:
  repository: telegraf
  tag: "1.32"
  pullPolicy: IfNotPresent

# InfluxDB 1.x the collectors write to (telegraf.conf uses http://$INFLUXDB_HOST:8086)
influxdb:
  host: influxdb
  database: pg_monitoring

# Optional post-install/upgrade hook Job: creates RP "200d" and the 1h downsampling CQs in influxdb.database
# (files/influxdb/pg_monitoring_downsample.sh, DECISIONS.md D16). Idempotent; the raw RP "7d" must exist.
influxdbInit:
  enabled: false
  image: influxdb:1.8.6
  port: 8086
  # true: also roll up the raw 7d history once (each run)
  backfill: false
  # Secret with keys INFLUX_USERNAME / INFLUX_PASSWORD (admin, needed for CREATE RETENTION POLICY); empty = no auth
  existingSecret: ""
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi

# Default environment tag (`env`) of the instances without their own `env`
env: perf

# Monitored PostgreSQL instances, all served by ONE Telegraf Deployment: files/entrypoint.sh renders
# files/inputs.d once per instance (env DB<N>_INSTANCE / DB<N>_DSN / DB<N>_APP_DSN, N = position in the list).
# name        -> db_instance / host / server tag (unique)
# env         -> optional `env` tag of this instance, default .Values.env
# existingSecret: Secret with keys PG_DSN (maintenance DB, cluster-wide metrics) and
#                 PG_APP_DSN (application DB, table/index metrics). Recommended.
# dsn / appDsn: only for dev stands - the chart then creates the Secret itself.
instances:
  - name: db1
    existingSecret: pg-telegraf-db1
#  - name: db2
#    existingSecret: pg-telegraf-db2
#    env: stage
#  - name: dev
#    dsn: "postgres://telegraf_monitoring_user:pass@postgres:5432/postgres?sslmode=disable&statement_timeout=5000"
#    appDsn: "postgres://telegraf_monitoring_user:pass@postgres:5432/demo?sslmode=disable&statement_timeout=5000"

# Generated pg-* dashboards as a ConfigMap picked up by the Grafana dashboards sidecar
dashboards:
  enabled: true
  labels:
    grafana_dashboard: "1"

networkPolicy:
  enabled: true
  # Telegraf only initiates connections (PostgreSQL, InfluxDB, DNS); no ingress is needed.
  policyTypes:
    - Ingress
  egress: []

replicaCount: 1

# telegraf user/group built into the official telegraf image
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

# One agent for all instances (metric_buffer_limit 40000): scale with the number of instances
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
