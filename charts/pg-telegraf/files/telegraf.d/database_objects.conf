# Per-database table / index statistics: pg_stat_user_* only show the DB you are connected to,
# so this input connects to the application DB (PG_APP_DSN). For more app DBs per instance copy
# this block with another DSN variable.

[[inputs.postgresql_extensible]]
    interval = "5m"
    address = "${PG_APP_DSN}"
    outputaddress = "${PG_INSTANCE}"
    prepared_statements = false

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/database_table_stat.sql"
        tagvalue = "datname,schemaname,relname"
        measurement = "pg_table_stat"

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/database_index_stat.sql"
        tagvalue = "datname,schemaname,relname,indexrelname"
        measurement = "pg_index_stat"

    [inputs.postgresql_extensible.tags]
        db_and_stand = "${INFLUX_DB_MONITORING}"
        retention_policy = "7d"
