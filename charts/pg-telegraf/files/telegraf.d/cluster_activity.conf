# Cluster-wide activity metrics, collected once per instance through the maintenance DB (PG_DSN).
# SQL lives in sql/*.sql (mounted to /etc/telegraf/sql), see docs/metrics-catalog.md.

[[inputs.postgresql_extensible]]
    interval = "15s"
    address = "${PG_DSN}"
    outputaddress = "${PG_INSTANCE}"
    prepared_statements = false

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/cluster_activity_grouped.sql"
        tagvalue = "datname,usename,application_name,state,wait_event_type"
        measurement = "pg_activity_grouped"

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/cluster_locks_blocked.sql"
        tagvalue = "datname"
        measurement = "pg_locks_blocked"

    [inputs.postgresql_extensible.tags]
        db_and_stand = "${INFLUX_DB_MONITORING}"
        retention_policy = "7d"


[[inputs.postgresql_extensible]]
    interval = "30s"
    address = "${PG_DSN}"
    outputaddress = "${PG_INSTANCE}"
    prepared_statements = false

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/cluster_db_limits.sql"
        tagvalue = "datname"
        measurement = "pg_db_limits"

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/cluster_role_limits.sql"
        tagvalue = "rolname"
        measurement = "pg_role_limits"

    [inputs.postgresql_extensible.tags]
        db_and_stand = "${INFLUX_DB_MONITORING}"
        retention_policy = "7d"


[[inputs.postgresql_extensible]]
    interval = "60s"
    address = "${PG_DSN}"
    outputaddress = "${PG_INSTANCE}"
    prepared_statements = false

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/cluster_db_stat.sql"
        tagvalue = "datname"
        measurement = "pg_db_stat"

    [inputs.postgresql_extensible.tags]
        db_and_stand = "${INFLUX_DB_MONITORING}"
        retention_policy = "7d"
