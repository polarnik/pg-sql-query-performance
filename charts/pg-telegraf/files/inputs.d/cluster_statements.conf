# pg_stat_statements: per queryid, per mask, and md5 -> full text. Once per instance (PG_DSN must point
# to the DB where the extension is created). Text is stored as fields, md5/ids as tags.

[[inputs.postgresql_extensible]]
    interval = "5m"
    address = "${PG_DSN}"
    outputaddress = "${PG_INSTANCE}"
    prepared_statements = false

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/cluster_stmt.sql"
        tagvalue = "usename,datname,queryid,toplevel,query_md5,query_mask_md5"
        measurement = "pg_stmt"

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/cluster_stmt_mask.sql"
        tagvalue = "usename,datname,query_mask_md5"
        measurement = "pg_stmt_mask"

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/cluster_stmt_totals.sql"
        tagvalue = "usename,datname"
        measurement = "pg_stmt_totals"

    [inputs.postgresql_extensible.tags]
        db_instance = "${PG_INSTANCE}"
        host = "${PG_INSTANCE}"
        env = "${PG_ENV}"
        db_and_stand = "${INFLUX_DB_MONITORING}"
        retention_policy = "7d"


[[inputs.postgresql_extensible]]
    interval = "30m"
    address = "${PG_DSN}"
    outputaddress = "${PG_INSTANCE}"
    prepared_statements = false

    [[inputs.postgresql_extensible.query]]
        script = "/etc/telegraf/sql/cluster_stmt_text.sql"
        tagvalue = "query_md5,query_mask_md5"
        measurement = "pg_stmt_text"

    [inputs.postgresql_extensible.tags]
        db_instance = "${PG_INSTANCE}"
        host = "${PG_INSTANCE}"
        env = "${PG_ENV}"
        db_and_stand = "${INFLUX_DB_MONITORING}"
        retention_policy = "7d"
